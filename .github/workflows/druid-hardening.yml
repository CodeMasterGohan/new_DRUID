name: DRUID reliability contracts
on:
  push:
    branches:
      - main
      - improvements/retrieval-reliability-20261016
  pull_request:
jobs:
  fast-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 fastapi==0.115.8 httpx==0.28.1 \
            sqlalchemy==2.0.38 psycopg[binary]==3.2.9 \
            pydantic==2.11.7 pydantic-settings==2.7.1 PyYAML==6.0.2
          python -m pip check
      - name: Compile source
        run: python -m compileall -q services tests skills/druid-natural-language/scripts skills/druid-management/scripts
      - name: Execute retrieval and deployment contracts (mocked backends)
        run: |
          python -m pytest -q services/retrieval/tests services/ingestion/tests services/embedding/tests tests/test_p0_wiring.py tests/test_deploy_wiring.py tests/test_druid_natural_language_skill.py
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
          docker compose --env-file .env -f deploy/docker-compose.gpu.yml config --quiet
  mcp-auth-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MCP test dependencies
        run: |
          python -m pip install -r services/mcp_server/requirements.txt
          python -m pip check
      - name: Test bearer-token tenancy and MCP transport
        env:
          PYTHONPATH: .:services/mcp_server/src
        run: python -m pytest -q services/mcp_server/tests
  web-ui-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Web UI test dependencies
        run: |
          python -m pip install -r services/web_ui/requirements.txt
          python -m pip check
      - name: Test login redirects, cookies and tenant UI isolation
        working-directory: services/web_ui
        run: python -m pytest -q tests
  identity-management-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install identity and API dependencies
        run: |
          python -m pip install -r services/document_api/requirements.txt
          python -m pip install PyJWT==2.10.1
          python -m pip check
      - name: Exercise internal groups and REST administration
        env:
          PYTHONPATH: .:services/document_api
        run: |
          python -m pytest -q services/catalog/tests/test_identity.py services/document_api/tests/test_identity_admin.py services/document_api/tests/test_document_ownership.py services/gateway/tests/test_internal_groups.py

  gitlab-ci-manifest-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate GitLab YAML and deployment script structure
        run: |
          python -m pip install PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml
          pipeline = yaml.safe_load(Path(".gitlab-ci.yml").read_text())
          overlay = yaml.safe_load(Path(".gitlab/images.compose.yml").read_text())
          assert pipeline["workflow"]["rules"]
          assert "build-images" in pipeline
          assert "deploy-staging" in pipeline
          assert "deploy-production" in pipeline
          assert "migrate-staging" in pipeline
          assert "migrate-production" in pipeline
          assert "rollback-production" in pipeline
          assert pipeline["build-images"]["parallel"]["matrix"]
          assert overlay["services"]
          assert "secret-detection" in pipeline
          for key in ("DEPLOY_SSH_KEY_FILE", "DEPLOY_KNOWN_HOSTS_FILE"):
              assert key in Path(".gitlab/scripts/ssh-deploy.sh").read_text()
          PY
          sh -n .gitlab/scripts/ssh-deploy.sh
          sh -n .gitlab/scripts/remote-deploy.sh
      - name: Validate image overlay with current Compose files
        run: |
          cp .env.example .env
          CI_IMAGE_PREFIX=registry.example.invalid/org/project CI_IMAGE_TAG=abcdef123456 docker compose --env-file .env -f deploy/docker-compose.yml -f .gitlab/images.compose.yml config --quiet


  complete-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ci/requirements-test.txt
      - run: python -m pip check
      # Flat service imports require separate processes for the Web UI.
      - run: python -m pytest -q services tests --ignore=services/web_ui/tests
      - run: cd services/web_ui && python -m pytest -q tests
  database-broker-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_PASSWORD: druid-test-only
          POSTGRES_DB: druid_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports: ['6379:6379']
    env:
      DRUID_TEST_DATABASE_URL: postgresql+psycopg://postgres:druid-test-only@localhost:5432/druid_test
      DRUID_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ci/requirements-test.txt
      - run: python -m pytest -q tests/test_production_integration.py
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.7.3
      - name: Audit pinned service dependencies
        run: |
          result=0
          for req in services/*/requirements.txt; do
            python -m pip_audit -r "$req" --disable-pip --no-deps || result=1
          done
          exit "$result"
      - name: Source vulnerability, secret and configuration gate
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.2 fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /src
