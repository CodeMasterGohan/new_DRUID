# new_DRUID infrastructure + CPU services.
# GPU inference (vLLM/olmOCR) lives in docker-compose.gpu.yml — it is the ONLY
# GPU consumer per spec §2 and must never share the card uncontended.
name: druid

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # TODO: pin to a dated RELEASE tag at deploy time (e.g. RELEASE.2025-XX-XXTXX-XX-XXZ)
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcddata:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # Milvus shares OUR MinIO (separate bucket) instead of running its own.
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
    volumes:
      - milvusdata:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # ── one-shot jobs ──────────────────────────────────────────────
  catalog:
    build:
      context: ..
      dockerfile: services/catalog/Dockerfile
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  milvus_setup:
    build:
      context: ..
      dockerfile: services/milvus_setup/Dockerfile
    env_file:
      - ../.env
    environment:
      MILVUS_URI: http://milvus:19530
    depends_on:
      - milvus
    # Retries the Milvus connection internally until healthy, then exits.

  # ── long-running CPU services ──────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  document_api:
    build:
      context: ..
      dockerfile: services/document_api/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${DOCUMENT_API_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mcp_server:
    build:
      context: ..
      dockerfile: services/mcp_server/Dockerfile
    env_file:
      - ../.env
    environment:
      # TODO: remove once real Retrieval/Ingestion/Catalog HTTP clients land
      # (sibling scope). Without this, create_app() refuses to build and the
      # service crash-loops. Dev/fake clients only — never real tenant data.
      DRUID_MCP_DEV_FAKE_CLIENTS: "1"
    ports:
      - "${MCP_PORT:-8002}:8002"
    depends_on:
      - document_api
    restart: unless-stopped


  web_ui:
    build:
      context: ..
      dockerfile: services/web_ui/Dockerfile
    env_file:
      - ../.env
    environment:
      # The UI talks to the gateway only (compose DNS); the browser reaches
      # the UI on the host-mapped port.
      GATEWAY_URL: "http://gateway:8000"
    ports:
      - "${WEB_UI_PORT:-8005}:8005"
    depends_on:
      - gateway
    restart: unless-stopped

  embedding:
    build:
      context: ..
      dockerfile: services/embedding/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${EMBEDDING_PORT:-8003}:8003"
    volumes:
      # Host artifact registry, READ-ONLY. Missing models fail startup.
      - ${MODEL_DIR:-/models}:/models:ro
    restart: unless-stopped

  retrieval:
    build:
      context: ..
      dockerfile: services/retrieval/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${RETRIEVAL_PORT:-8004}:8004"
    volumes:
      - ${MODEL_DIR:-/models}:/models:ro
    depends_on:
      - milvus
      - embedding
    restart: unless-stopped

  ingestion:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ${MODEL_DIR:-/models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      # Shared with the gpu project so workers can reach vLLM by its
      # compose service name (vllm-olmocr). Create once:
      #   docker network create druid-net
      - druid-net
    restart: unless-stopped
    # Scale CPU workers: docker compose up -d --scale ingestion=4

volumes:
  pgdata:
  redisdata:
  miniodata:
  etcddata:
  milvusdata:

networks:
  druid-net:
    name: druid-net
    external: true
