[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "druid-retrieval-fastpath"
version = "0.1.0"
requires-python = ">=3.11"
description = "Optional Rust accelerator for DRUID's CPU-only retrieval fusion and passage preparation"

[tool.maturin]
bindings = "pyo3"
