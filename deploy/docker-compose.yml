# new_DRUID infrastructure + CPU services.
# GPU inference (vLLM/olmOCR) lives in docker-compose.gpu.yml — it is the ONLY
# GPU consumer per spec §2 and must never share the card uncontended.
name: druid

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - /DATA/docker/mounts/druid/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

    networks:
    - default
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
    - /DATA/docker/mounts/druid/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

    networks:
    - default
  rustfs:
    # Replaces MinIO (community edition archived 2026). RustFS runs as
    # non-root UID 10001; the named volume is owned on first start.
    image: rustfs/rustfs:1.0.1
    command: ["--console-address", ":9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
    - /DATA/docker/mounts/druid/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

    networks:
    - default
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
    - ETCD_AUTO_COMPACTION_MODE=revision
    - ETCD_AUTO_COMPACTION_RETENTION=1000
    - ETCD_QUOTA_BACKEND_BYTES=4294967296
    - ETCD_SNAPSHOT_COUNT=50000
    volumes:
    - /DATA/docker/mounts/druid/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

    networks:
    - default
  milvus:
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # Milvus shares OUR RustFS (separate bucket) instead of running its own.
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      MINIO_USE_SSL: "false"
    volumes:
    - /DATA/docker/mounts/druid/milvus:/var/lib/milvus
    depends_on:
    - etcd
    - rustfs
    restart: unless-stopped

  # ── one-shot jobs ──────────────────────────────────────────────
    networks:
    - default
  catalog:
    build:
      context: ..
      dockerfile: services/catalog/Dockerfile
    env_file:
    - ../.env
    depends_on:
      postgres:
        condition: service_healthy

    networks:
    - default
  milvus_setup:
    build:
      context: ..
      dockerfile: services/milvus_setup/Dockerfile
    env_file:
    - ../.env
    environment:
      MILVUS_URI: http://milvus:19530
    depends_on:
    - milvus
    # Retries the Milvus connection internally until healthy, then exits.

  # ── long-running CPU services ──────────────────────────────────
    networks:
    - default
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    env_file:
    - ../.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

    networks:
    - default
  document_api:
    build:
      context: ..
      dockerfile: services/document_api/Dockerfile
    env_file:
    - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

    networks:
    - default
  mcp_server:
    build:
      context: ..
      dockerfile: services/mcp_server/Dockerfile
    env_file:
    - ../.env
    ports:
    - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PORT:-8002}:8002"
    depends_on:
    - document_api
    - retrieval
    restart: unless-stopped


    networks:
    - default
    - cora
  web_ui:
    build:
      context: ..
      dockerfile: services/web_ui/Dockerfile
    env_file:
    - ../.env
    environment:
      # The UI talks to the gateway only (compose DNS); the browser reaches
      # the UI on the host-mapped port.
      GATEWAY_URL: "http://gateway:8000"
    ports:
    - "${WEB_UI_BIND_IP:-127.0.0.1}:${WEB_UI_PORT:-8005}:8005"
    depends_on:
    - gateway
    restart: unless-stopped

    networks:
    - default
    - cora
  embedding:
    build:
      context: ..
      dockerfile: services/embedding/Dockerfile
    env_file:
    - ../.env
    environment:
      EMBEDDING_MODEL_PATH: /models/google/embeddinggemma-2
      EMBEDDING_MODEL_DIR: /models/google/embeddinggemma-2
    volumes:
      # Host artifact registry, READ-ONLY. Missing models fail startup.
    - ${MODEL_DIR:-/DATA/docker/mounts/models}:/models:ro
    restart: unless-stopped

    networks:
    - default
  retrieval:
    build:
      context: ..
      dockerfile: services/retrieval/Dockerfile
    env_file:
    - ../.env
    environment:
      MINILM_MODEL_PATH: /models/cross-encoder/ms-marco-MiniLM-L6-v2
      MINILM_TOKENIZER_PATH: /models/cross-encoder/ms-marco-MiniLM-L6-v2
      EMBEDDING_URL: http://embedding:8003
    volumes:
    - ${MODEL_DIR:-/DATA/docker/mounts/models}:/models:ro
    depends_on:
    - milvus
    - embedding
    restart: unless-stopped

    networks:
    - default
  ingestion:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    env_file:
    - ../.env
    environment:
      EMBEDDING_MODEL_PATH: /models/google/embeddinggemma-2
      MINILM_TOKENIZER_PATH: /models/cross-encoder/ms-marco-MiniLM-L6-v2
    volumes:
    - ${MODEL_DIR:-/DATA/docker/mounts/models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      # Shared with the gpu project so workers can reach vLLM by its
      # compose service name (vllm-olmocr). Create once:
      #   docker network create druid-net
    - default
    - druid-net
    restart: unless-stopped
    # Scale CPU workers: docker compose up -d --scale ingestion=4


networks:
  cora:
    name: cora
    external: true
  druid-net:
    name: druid-net
    external: true
